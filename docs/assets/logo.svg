<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo Factronics Videojet Lab">
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a4c"/>
      <stop offset="1" stop-color="#0b3a6b"/>
    </linearGradient>
    <linearGradient id="fv-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8e8"/>
      <stop offset="1" stop-color="#2e7fe0"/>
    </linearGradient>
    <radialGradient id="fv-glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#19d2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#19d2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo redondeado -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#fv-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#fv-glow)"/>

  <!-- lineas de banda termica (TTO) a la izquierda -->
  <g stroke="#123a5e" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="118" y1="332" x2="176" y2="332"/>
    <line x1="118" y1="364" x2="158" y2="364"/>
    <line x1="118" y1="396" x2="168" y2="396"/>
  </g>

  <!-- rayo laser (linea + arco) -->
  <g>
    <line x1="452" y1="120" x2="392" y2="188" stroke="#7fe3ff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M392 188 a 30 30 0 0 1 44 22" fill="none" stroke="#7fe3ff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <circle cx="392" cy="188" r="7" fill="#7fe3ff"/>
  </g>

  <!-- cabezal / boquilla -->
  <g fill="url(#fv-accent)">
    <rect x="232" y="88" width="48" height="26" rx="6"/>
    <path d="M236 114 h40 l-6 18 h-28 z"/>
    <rect x="249" y="132" width="14" height="16" rx="3"/>
  </g>

  <!-- chorro + gota -->
  <line x1="256" y1="150" x2="256" y2="176" stroke="url(#fv-accent)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="186" r="11" fill="#19d2ff"/>

  <!-- letV: la gota forma la V -->
  <path d="M182 216 L256 368 L330 216"
        fill="none" stroke="url(#fv-accent)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- brillo -->
  <circle cx="176" cy="230" r="5" fill="#8ae6ff" opacity="0.85"/>
  <circle cx="344" cy="298" r="4" fill="#8ae6ff" opacity="0.7"/>
</svg>

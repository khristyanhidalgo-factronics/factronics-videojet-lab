name: Validar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar JSON, notas (SHA-256), app y enlaces
        run: python tools/validar_repo.py
      - name: Probar banco de preguntas TTO
        run: python tools/test_banco_tto.py
      - name: Probar calculadora CIJ y referencia VJ1210/V401
        run: python tools/test_app_calculo.py
      - name: Probar traducciones de contenido (es/en/pt/it/zh)
        run: python tools/test_traducciones.py
      - name: Probar partes CIJ por OCR (IPL 1550/1710)
        run: python tools/test_partes_cij_ocr.py
      - name: Probar cotejo de partes TTO contra listas oficiales 6330/6530
        run: python tools/test_partes_tto.py
      - name: Probar velocidades CIJ contra los charts oficiales
        run: python tools/test_velocidades_cij.py
      - name: Probar cierre del lote laser (14 casos)
        run: python tools/test_lote_laser.py
      - name: Probar artefactos de revision de pendientes
        run: python tools/test_revision_pendientes.py
